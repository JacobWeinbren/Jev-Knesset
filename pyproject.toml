[project]
name = "knesset-ches"
version = "0.1.0"
description = "Knesset speech scored on the Chapel Hill Expert Survey's Israel scales with TypeSafe's Jev."
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "pyarrow>=16",
    "scipy>=1.13",
    "pyyaml>=6",
    "httpx>=0.27",
    "tqdm>=4.66",
    "matplotlib>=3.9",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
knesset-ches = "knesset_ches.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/knesset_ches"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
