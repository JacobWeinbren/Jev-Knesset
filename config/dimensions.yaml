  score:
    instructions: Based only on the views the speaker expresses in the text, what is the speaker's position toward
      policies supporting gender equality (e.g. family leave, equal pay)?
    levels:
    - Strongly supports policies promoting gender equality.
    - Somewhat supports policies promoting gender equality.
    - Neutral or mixed position on policies promoting gender equality.
    - Somewhat opposes policies promoting gender equality.
    - Strongly opposes policies promoting gender equality.
