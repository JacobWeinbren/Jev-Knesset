    when_true: The text expresses the speaker's own view on the role of religious principles in politics or on a
      religion-and-state issue.
    when_false: The text does not express a view on the role of religious principles in politics (it is absent, is
      only mentioned in passing or procedurally, or the speaker only reports facts or other people's views about it
      without taking a side).
  score:
    instructions: Based only on the views the speaker expresses in the text, what is the speaker's position on the
      role of religious principles in politics?
    levels:
    - Strongly opposes religious principles in politics.
    - Somewhat opposes religious principles in politics.
    - Neutral or mixed position on religious principles in politics.
    - Somewhat supports religious principles in politics.
    - Strongly supports religious principles in politics.
- id: anti_islam_rhetoric
  kind: salience
  ches_variable: anti_islam_rhetoric
  score:
    instructions: How important is ANTI-ISLAM RHETORIC used by the speaker in the text? Anti-Islam rhetoric means
      the speaker's own hostility toward, fear of, or negative generalizations about Islam as a religion or Muslims
      as a group, including portraying people, parties or movements as dangerous or illegitimate because they are
      Muslim or Islamic. Hostility aimed only at specific armed organizations or foreign regimes (for example Hamas,
      Islamic Jihad, Hezbollah, ISIS or Iran) does not count; it counts only when the speaker extends it to Islam
      or Muslims in general. The speaker reporting, quoting or condemning anti-Islam statements made by others does
      not count either.
    levels:
    - 'Not important at all: the speaker uses no anti-Islam rhetoric (Islam or Muslims are not mentioned, are mentioned
      only neutrally or positively, or the speaker only reports or condemns anti-Islam statements made by others).'
    - 'Slightly important: the speaker makes one brief or passing anti-Islam remark.'
    - 'Moderately important: the speaker makes several anti-Islam remarks, but they are a small part of the text.'
    - 'Very important: the speaker''s anti-Islam rhetoric runs through a large part of the text.'
    - 'Extremely important: most of the text consists of the speaker''s anti-Islam rhetoric.'
- id: people_vs_elite
  kind: position
  ches_variable: people_vs_elite
  gate:
    instructions: Does the speaker express a view, in the text, on whether the most important political decisions should
      be made directly by 'the people' (for example by voting in a referendum) rather than by elected representatives?
    when_true: The text expresses the speaker's own view on direct decision-making by 'the people' (for example a
      referendum) versus decisions by elected representatives.
    when_false: The text expresses no such view. This includes texts that only set elected officials against courts,
      judges, legal advisers or civil servants, that only invoke the election result, the majority or 'the will of
      the people', or that only call for new elections.
  score:
    instructions: Some speakers believe that ELECTED REPRESENTATIVES should make the most important political decisions.
      At the opposite pole are speakers who take the position that 'THE PEOPLE' should have the final say on the most
      important issues, for example, by voting directly in referendums. Based only on the views the speaker expresses
      in the text, where does the speaker fall on this dimension?
    levels:
    - Elected office holders should make the most important decisions.
    - Leans toward elected office holders making the most important decisions.
    - Neutral or mixed position between the two.
    - Leans toward 'the people', not politicians, making the most important decisions.
    - '''The people'', not politicians, should make the most important decisions.'
- id: antielite_salience
  kind: salience
  ches_variable: antielite_salience
  score:
    instructions: 'How important is ANTI-ESTABLISHMENT or ANTI-ELITE RHETORIC used by the speaker in the text? Such
      rhetoric means the speaker portraying ''the establishment'' or ''the elites'' as a group (for example political,
      judicial, legal, media, economic or academic elites, or senior officials) as self-serving, corrupt, or out of
      touch with ordinary people. The following do not count: ordinary criticism of a specific government, minister,
      party, policy, institution or court ruling; and the speaker reporting or condemning such rhetoric by others.'
    levels:
