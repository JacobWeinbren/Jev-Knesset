    - Strongly supports diplomatic engagement with Arab countries.
    - Somewhat supports diplomatic engagement with Arab countries.
    - Neutral or mixed position on diplomatic engagement with Arab countries.
    - Somewhat opposes diplomatic engagement with Arab countries.
    - Strongly opposes diplomatic engagement with Arab countries.
- id: religious_principles
  kind: position
  ches_variable: religious_principles
  gate:
    instructions: Does the speaker express a view, in the text, on the role of religious principles (of any religion)
      in politics, for example on religion-and-state issues such as religious legislation, Sabbath observance in public,
      marriage and divorce, conversion, kashrut, the powers of the rabbinate and religious courts, military service
