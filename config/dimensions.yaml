- id: democratic_v_jewish_state
  kind: position
  ches_variable: democratic_v_jewish_state
  gate:
    instructions: Does the speaker express a view, in the text, on the tension between Israel as a "democratic" state
      and as a "Jewish" state, for example on equal rights for non-Jewish Israelis, the special status of Judaism
      in public life (such as the Law of Return and the status quo agreement), or governing the state by Torah law?
    when_true: The text expresses the speaker's own view on the democratic vs. Jewish character of the state.
    when_false: The text does not express the speaker's own view on the democratic vs. Jewish character of the state
      (it is absent, only mentioned in passing or procedurally, or the text is about democracy in another sense, such
      as majority rule, elections or the courts, without reference to the Jewish character of the state or the status
      of non-Jewish Israelis).
  score:
    instructions: Speakers can be classified in terms of their stance on the tension between a "Democratic" and a
      "Jewish" state. Those on the "Democratic" extreme believe in equal rights and treatment to all Israelis, whether
      Jewish or not, and elimination of the special status of Judaism in public life (such as the Law of Return and
      the status quo agreement). Those on the "Jewish" extreme believe that Israel is the homeland of the Jewish people,
      that Jewish culture should guide public life, and that the state should be governed by the Torah laws (Medinat
      Halacha). Based only on the views the speaker expresses in the text, where does the speaker stand on democratic
      vs. Jewish issues?
    levels:
    - 'Strongly supports a democratic state: equal rights and treatment for all Israelis, whether Jewish or not, and
      elimination of the special status of Judaism in public life (such as the Law of Return and the status quo
      agreement).'
    - 'Leans toward a democratic state: where the two conflict, gives more weight to equal rights for all citizens
      than to the state''s Jewish character.'
    - 'Equally Jewish and democratic state: where the two conflict, gives neither priority.'
    - 'Leans toward a Jewish state: where the two conflict, gives more weight to the state''s Jewish character (the
      homeland of the Jewish people, Jewish culture guiding public life) than to equal treatment of non-Jews, without
      calling for Torah law.'
    - 'Strongly supports a Jewish (Halacha) state: Israel is the homeland of the Jewish people, Jewish culture should
      guide public life, and the state should be governed by the Torah laws (Medinat Halacha).'
- id: gender_equality
