# The CHES-Israel 2021-22 questions, asked of packs. Score ends are CHES's 0 and 10. Items without a ches_variable
# are ours. Rewording a question changes its prompt hash, and its stored answers stop counting.

dimensions:
- id: lrecon
  kind: position
  ches_variable: lrecon
  gate:
    instructions: Does the speaker express a view, in the text, on economic issues such as privatization, taxes,
      regulation, government spending, or the welfare state?
    when_true: The text expresses the speaker's own view on at least one such economic issue.
    when_false: The text does not express a view on economic issues (they are absent, are only mentioned in passing
      or procedurally, or the speaker only reports facts or other people's views about them without taking a side).
  score:
    instructions: Speakers can be classified in terms of their stance on ECONOMIC ISSUES such as privatization, taxes,
      regulation, government spending, and the welfare state. Those on the economic left want government to play an
      active role in the economy. Those on the economic right want a reduced role for government. Based only on the
      views the speaker expresses in the text, where does the speaker stand on economic issues?
    levels:
    - 'Extreme left: wants government to play an active role in the economy, for example a strong role for government
      in redistributing wealth, protecting jobs, and regulating business, and steeply progressive taxes to fund social
      programs.'
    - 'Left of center: leans toward an active role for government in the economy.'
    - 'Center: between the two, or holds a mix of economic left and economic right positions.'
    - 'Right of center: leans toward a reduced role for government in the economy.'
    - 'Extreme right: wants a reduced role for government in the economy, for example small government, minimal
      regulation of business, privatization of many government operations, and opposition to high taxes.'
- id: lrecon_salience
  kind: salience
  ches_variable: lrecon_salience
  gate_share_of: lrecon
  score:
    instructions: How important are ECONOMIC ISSUES (such as privatization, taxes, regulation, government spending,
      and the welfare state) to the speaker in the text? Judge importance only by how much of the text the speaker
      devotes to economic issues.
    levels:
    - 'No importance: economic issues do not come up in the text.'
    - 'Little importance: economic issues are mentioned only briefly or in passing; the text is about other subjects.'
    - 'Moderate importance: economic issues are a secondary subject: the speaker discusses them, but most of the text
      is about other subjects.'
    - 'High importance: economic issues are one of two or more main subjects that share the text about equally.'
    - 'Great importance: economic issues are the main subject: most or all of the text is about them.'
- id: galtan
  kind: position
  ches_variable: galtan
  gate:
    instructions: Does the speaker express a view, in the text, on social and cultural values, that is, on expanded
      personal freedoms (for example abortion rights, divorce, same-sex marriage and LGBT rights, civil marriage,
      or freedom from religious rules on the Sabbath, kashrut or conversion) or on whether the government should be
      a firm moral authority upholding order, tradition and stability on social and cultural issues?
    when_true: The text expresses the speaker's own view on at least one such social or cultural values issue.
    when_false: The text does not express a view on social and cultural values (they are absent, are only mentioned
      in passing or procedurally, or the speaker only reports facts or other people's views about them without taking
      a side).
  score:
    instructions: Speakers can be classified in terms of their views on social and cultural values. "LIBERTARIAN" or
      "POSTMATERIALIST" speakers favor expanded personal freedoms, for example, abortion rights, divorce, and same-sex
      marriage. "TRADITIONAL" or "AUTHORITARIAN" speakers reject these ideas in favor of order, tradition, and
      stability, believing that the government should be a firm moral authority on social and cultural issues. Based
      only on the views the speaker expresses in the text, where does the speaker stand on libertarian/traditional
      issues?
    levels:
    - 'Libertarian/postmaterialist: favors expanded personal freedoms, for example abortion rights, divorce, and
      same-sex marriage.'
    - 'Leans libertarian/postmaterialist: mostly favors expanded personal freedoms, with some reservations.'
    - 'Center: between the two, or balances personal freedoms against order and tradition.'
    - 'Leans traditional/authoritarian: mostly favors tradition and moral authority over expanded personal freedoms,
      with some exceptions.'
    - 'Traditional/authoritarian: rejects expanded personal freedoms (for example abortion rights, divorce, and same-sex
      marriage) in favor of order, tradition, and stability, and believes the government should be a firm moral
      authority on social and cultural issues.'
- id: galtan_salience
  kind: salience
  ches_variable: galtan_salience
  gate_share_of: galtan
  score:
    instructions: 'How important are LIBERTARIAN/TRADITIONAL issues to the speaker in the text? Libertarian/traditional
      issues are issues of social and cultural values: expanded personal freedoms (for example abortion rights, divorce,
      same-sex marriage and LGBT rights, civil marriage, or freedom from religious rules on the Sabbath, kashrut or
      conversion) versus order, tradition and stability, with the government as a firm moral authority on social and
      cultural issues. Judge importance only by how much of the text the speaker devotes to these issues.'
    levels:
    - 'No importance: libertarian/traditional issues (social and cultural values: personal freedoms vs. tradition
      and moral authority) do not come up in the text.'
    - 'Little importance: libertarian/traditional issues (social and cultural values: personal freedoms vs. tradition
      and moral authority) are mentioned only briefly or in passing; the text is about other subjects.'
    - 'Moderate importance: libertarian/traditional issues (social and cultural values: personal freedoms vs. tradition
      and moral authority) are a secondary subject: the speaker discusses them, but most of the text is about other
      subjects.'
    - 'High importance: libertarian/traditional issues (social and cultural values: personal freedoms vs. tradition
      and moral authority) are one of two or more main subjects that share the text about equally.'
    - 'Great importance: libertarian/traditional issues (social and cultural values: personal freedoms vs. tradition
      and moral authority) are the main subject: most or all of the text is about them.'
- id: israel_palestine
  kind: position
  ches_variable: israel_palestine
  gate:
    instructions: Does the speaker express a view, in the text, on Israeli-Palestinian conflict issues, such as the
      solution to the conflict, negotiations with the Palestinians (the PLO or the Palestinian Authority), the
      settlements, withdrawal from or annexation of the territories, or a Palestinian state?
    when_true: The text expresses the speaker's own view on at least one such Israeli-Palestinian conflict issue.
    when_false: The text does not express a view on Israeli-Palestinian conflict issues (they are absent, are only
      mentioned in passing or procedurally, or the speaker only reports facts or other people's views about them without
      taking a side, or the speaker only discusses security incidents or military operations without a view on these
      issues).
  score:
    instructions: Speakers can be classified in terms of their stance on Israeli-Palestinian conflict issues such as the
      solution to the conflict, the settlements, and a Palestinian state. Those on the left support a peaceful solution
      to the conflict, evacuation of the settlements, and a Palestinian state. Those on the right oppose negotiation
      with the Palestinian Authority (or, before it existed, the PLO) and a Palestinian state, and support annexation of
      the territories (applying Israeli sovereignty to them or keeping them permanently under Israeli rule). Based only
      on the views the speaker expresses in the text, where does the speaker stand on Israeli-Palestinian conflict
      issues?
    levels:
    - 'Left: supports a peaceful solution to the conflict (a negotiated agreement with the Palestinians), evacuation
      of the settlements, and a Palestinian state.'
    - 'Left of center: leans toward the left position, for example supports negotiations and territorial compromise
      but not every left position.'
    - 'Center: between the two, or holds a mix of left and right positions.'
    - 'Right of center: leans toward the right position, for example is sceptical of negotiations or of territorial
      withdrawal, or supports the settlements, but not every right position.'
    - 'Right: opposes negotiation with the Palestinian Authority (or, before it existed, the PLO) and a Palestinian
      state, and supports annexation of the territories (applying Israeli sovereignty to them or keeping them
      permanently under Israeli rule).'
- id: israel_palestine_salience
  kind: salience
  ches_variable: israel_palestine_salience
  gate_share_of: israel_palestine
  score:
    instructions: How important are ISRAELI-PALESTINIAN CONFLICT ISSUES (such as the solution to the conflict,
      negotiations with the Palestinians, the settlements, and a Palestinian state) to the speaker in the text? Judge
      importance only by how much of the text the speaker devotes to these issues.
    levels:
    - 'No importance: Israeli-Palestinian conflict issues do not come up in the text.'
    - 'Little importance: Israeli-Palestinian conflict issues are mentioned only briefly or in passing; the text is
      about other subjects.'
    - 'Moderate importance: Israeli-Palestinian conflict issues are a secondary subject: the speaker discusses them,
      but most of the text is about other subjects.'
    - 'High importance: Israeli-Palestinian conflict issues are one of two or more main subjects that share the text
      about equally.'
    - 'Great importance: Israeli-Palestinian conflict issues are the main subject: most or all of the text is about
      them.'
- id: lrgen
  kind: position
  ches_variable: lrgen
  gate:
    instructions: Does the speaker express, in the text, a view on an issue that divides left and right in Israeli
      politics, for example the Israeli-Palestinian conflict and security policy, the settlements, religion and state,
      the Jewish and democratic character of the state, the rights of the Arab minority, the power of the courts,
      or the role of government in the economy?
    when_true: The text expresses the speaker's own view on at least one issue that divides left and right in Israeli
      politics.
    when_false: The text expresses no view on such an issue (for example it is procedural, ceremonial, purely factual
      or technical, personal, or about a matter on which left and right do not differ).
  score:
    instructions: 'In Israeli politics, ''left'' and ''right'' refer first of all to the Israeli-Palestinian conflict,
      territory and security: the left favours a negotiated settlement and territorial compromise, the right opposes
      them and favours keeping the territories. Secondly they refer to identity: the left stresses liberal, civic
      and secular values, the right stresses Jewish national and traditional values. Economic policy plays only a
      minor part. Based only on the views the speaker expresses in the text, which level best describes the speaker''s
      OVERALL IDEOLOGY, on a scale ranging from extreme left to extreme right as left and right are understood in
      Israeli politics?'
    levels:
    - 'Extreme left: consistently and strongly takes the left''s positions as just described.'
    - 'Left of center: leans toward the left''s positions.'
    - 'Center: between the two, or a mix of left and right positions.'
    - 'Right of center: leans toward the right''s positions.'
    - 'Extreme right: consistently and strongly takes the right''s positions as just described.'
- id: jewish_immigration
  kind: position
  ches_variable: jewish_immigration
  gate:
    instructions: Does the speaker express a view, in the text, on policy toward Jewish immigration to Israel (Aliyah),
      including who should be entitled to immigrate under the Law of Return (for example the 'grandchild clause' or
      the recognition of conversions)?
    when_true: The text expresses the speaker's own view on policy toward Jewish immigration (Aliyah).
    when_false: The text does not express a view on Jewish immigration policy (it is absent, is only mentioned in
      passing or procedurally, or the speaker only reports facts or other people's views about it without taking a
      side).
  score:
    instructions: Based only on the views the speaker expresses in the text, where does the speaker stand on Jewish
      immigration (Aliyah)?
    levels:
    - Strongly favors a liberal policy on Jewish immigration (for example encouraging Aliyah and keeping or widening
      eligibility under the Law of Return).
    - Somewhat favors a liberal policy on Jewish immigration.
    - Neutral or mixed position on Jewish immigration policy.
    - Somewhat favors a restrictive policy on Jewish immigration.
    - Strongly favors a restrictive policy on Jewish immigration (for example narrowing eligibility under the Law
      of Return, or opposing the Law of Return itself).
- id: non_jewish_immigration
  kind: position
  ches_variable: non_jewish_immigration
  gate:
    instructions: Does the speaker express a view, in the text, on policy toward non-Jewish immigration to Israel
      (for example asylum seekers, migrant workers, or family reunification)?
    when_true: The text expresses the speaker's own view on policy toward non-Jewish immigration.
    when_false: The text does not express a view on non-Jewish immigration policy (it is absent, is only mentioned
      in passing or procedurally, or the speaker only reports facts or other people's views about it without taking
      a side).
  score:
    instructions: Based only on the views the speaker expresses in the text, what is the speaker's position toward
      non-Jewish immigration policy?
    levels:
    - Strongly favors a liberal policy on non-Jewish immigration.
    - Somewhat favors a liberal policy on non-Jewish immigration.
    - Neutral or mixed position on non-Jewish immigration policy.
    - Somewhat favors a restrictive policy on non-Jewish immigration.
    - Strongly favors a restrictive policy on non-Jewish immigration.
- id: multiculturalism
  kind: position
  ches_variable: multiculturalism
  gate:
    instructions: Does the speaker express a view, in the text, on how non-Jewish immigrants and asylum seekers should
      be integrated into Israeli society (multiculturalism vs. assimilation)?
    when_true: The text expresses the speaker's own view on the integration of non-Jewish immigrants or asylum seekers.
    when_false: The text does not express a view on the integration of non-Jewish immigrants and asylum seekers (it
      is absent, is only mentioned in passing or procedurally, or the speaker only reports facts or other people's
      views about it without taking a side).
  score:
    instructions: Based only on the views the speaker expresses in the text, what is the speaker's position on the
      integration of non-Jewish immigrants and asylum seekers (multiculturalism vs. assimilation)?
    levels:
    - Strongly favors multiculturalism.
    - Somewhat favors multiculturalism.
    - Neutral or mixed position between multiculturalism and assimilation.
    - Somewhat favors assimilation.
    - Strongly favors assimilation.
- id: redistribution
  kind: position
  ches_variable: redistribution
  gate:
    instructions: Does the speaker express a view, in the text, on redistribution of wealth or income from the rich
      to the poor?
    when_true: The text expresses the speaker's own view on redistribution of wealth or income.
    when_false: The text does not express a view on redistribution (it is absent, is only mentioned in passing or
      procedurally, or the speaker only reports facts or other people's views about it without taking a side).
  score:
    instructions: Based only on the views the speaker expresses in the text, where does the speaker stand on
      redistribution of wealth or income from the rich to the poor?
    levels:
    - Strongly favors redistribution.
    - Somewhat favors redistribution.
    - Neutral or mixed position on redistribution.
    - Somewhat opposes redistribution.
    - Strongly opposes redistribution.
- id: environment
  kind: position
  ches_variable: environment
  gate:
    instructions: Does the speaker express a view, in the text, on environmental sustainability or environmental
      protection, including the trade-off between environmental protection and economic growth?
    when_true: The text expresses the speaker's own view on environmental sustainability, environmental protection,
      or the trade-off between environmental protection and economic growth.
    when_false: The text does not express a view on environmental issues (they are absent, are only mentioned in passing
      or procedurally, or the speaker only reports facts or other people's views about them without taking a side).
  score:
    instructions: Based only on the views the speaker expresses in the text, what is the speaker's position towards
      environmental sustainability (environmental protection vs. economic growth)?
    levels:
    - Strongly supports environmental protection even at the cost of economic growth.
    - Somewhat prioritizes environmental protection over economic growth.
    - Neutral or mixed position between environmental protection and economic growth.
    - Somewhat prioritizes economic growth over environmental protection.
    - Strongly supports economic growth even at the cost of environmental protection.
- id: spendvtax
  kind: position
  ches_variable: spendvtax
  gate:
    instructions: Does the speaker express a view, in the text, on improving public services, on reducing taxes, or
      on the trade-off between them?
    when_true: The text expresses the speaker's own view on improving public services or on reducing taxes.
    when_false: The text does not express a view on public services or taxes (they are absent, are only mentioned
      in passing or procedurally, or the speaker only reports facts or other people's views about them without taking
      a side).
  score:
    instructions: Based only on the views the speaker expresses in the text, what is the speaker's position on improving
      public services vs. reducing taxes?
    levels:
    - Strongly favors improving public services, even if it means higher taxes.
    - Somewhat favors improving public services over reducing taxes.
    - Neutral or mixed position between improving public services and reducing taxes.
    - Somewhat favors reducing taxes over improving public services.
    - Strongly favors reducing taxes, even if it means less spending on public services.
- id: civlib
  kind: position
  ches_variable: civlib
  gate:
    instructions: Does the speaker express a view, in the text, on civil liberties versus law and order, that is,
      on how far individual rights and freedoms (for example freedom of speech and protest, privacy, due process,
      limits on detention, surveillance and police powers) may be restricted in order to fight crime or terrorism
      and keep order?
    when_true: The text expresses the speaker's own view on civil liberties, on tough law-and-order measures, or on
      the balance between them.
    when_false: The text expresses no such view (the subject is absent or only mentioned in passing, or the speaker
      only complains about crime or calls for more or better policing without addressing rights and freedoms).
  score:
    instructions: Based only on the views the speaker expresses in the text, what is the speaker's position on civil
      liberties vs. law and order?
    levels:
    - Strongly favors civil liberties, even at the cost of weaker law enforcement.
    - Somewhat favors civil liberties over tough law-and-order measures.
    - Neutral or mixed position between civil liberties and law and order.
    - Somewhat favors tough measures to fight crime over civil liberties.
    - Strongly favors tough measures to fight crime, even at the cost of civil liberties.
- id: abortion
  kind: position
  ches_variable: abortion
  gate:
    instructions: Does the speaker express a view on abortion in the text?
    when_true: The text expresses the speaker's own view on abortion.
    when_false: The text does not express a view on abortion (it is absent, is only mentioned in passing or
      procedurally, or the speaker only reports facts or other people's views about it without taking a side).
  score:
    instructions: Based only on the views the speaker expresses in the text, what is the speaker's position towards
      abortion?
    levels:
    - Strongly opposes restrictions on abortion (wants abortion to be legal and accessible).
    - Somewhat opposes restrictions on abortion.
    - Neutral or mixed position on abortion.
    - Somewhat supports restrictions on abortion.
    - Strongly supports restrictions on abortion (wants abortion to be limited or banned).
- id: jewish_settlements
  kind: position
  ches_variable: jewish_settlements
  gate:
    instructions: Does the speaker express a view, in the text, on the Jewish settlements in Judea and Samaria (the
      West Bank) or the Gaza Strip?
